# OpenDKIM — signs outgoing mail for retellis.com with the retellis selector.
# The keypair is generated on first container start by entrypoint.sh (if absent)
# and the public-key TXT record is printed to the container logs for DNS.
Socket inet:12345@localhost
Domain retellis.com
KeyFile /etc/opendkim/keys/retellis.com/retellis.private
Selector retellis
# Sign + verify (s=v); we only care about signing (verify is harmless here).
Mode sv
AutoRestart yes
Background no
Canonicalization relaxed/relaxed
# Run as root inside the container so the milter can read the generated key and
# write its pidfile without per-user permission setup (this is an internal
# signing-only milter, not exposed outside the compose network).
UserID root:root
PidFile /tmp/opendkim.pid