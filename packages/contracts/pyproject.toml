[project]
name = "ai-companion-contracts"
version = "0.1.0"
description = "Shared contracts (pydantic) for the Stillside API — kept in drift-checked parity with the zod schemas in src/ts."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]