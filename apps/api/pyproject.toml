[project]
name = "ai-companion-api"
version = "0.1.0"
description = "FastAPI backend for the open-source AI companion (BYOK vault, LiteLLM routing, event-chain memory)."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "pynacl>=1.5.0",
  "httpx>=0.28.1",
  "sse-starlette>=2.2.1",
  "litellm>=1.55.0",
  "sqlalchemy>=2.0.36",
  "asyncpg>=0.30.0",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3.6",
  "alembic>=1.14.0",
  "ai-companion-contracts",
  "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.2",
  "httpx>=0.28.1",
  "ruff>=0.8.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]