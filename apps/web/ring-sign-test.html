<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ring centering — sign test</title>
<style>
:root {
  --bg: #0d253d; --surface: #11304e; --surface-2: #0c2440;
  --border: #1c3a57; --border-soft: #2a4d72;
  --purple: #8b78ff; --mint: #4cc88a; --heading: #f4f1ea; --label: #94a1b2;
  --font: "sohne-var", "SF Pro Display", "Inter", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); font-family: var(--font); padding: 40px; display: flex; gap: 40px; }
.med-ring-wrap {
  position: relative; width: 180px; height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--purple) 6%, var(--surface-2)) 0%, var(--surface-2) 70%);
  box-shadow: inset 0 0 0 1px var(--border-soft);
}
.med-ring { position: absolute; inset: 0; width: 100%; height: 100%; }
.med-ring-bg { fill: none; stroke: var(--border); stroke-width: 6; opacity: 0.9; }
.med-ring-fg { fill: none; stroke: var(--mint); stroke-width: 6; stroke-linecap: round; }
.med-ring-center {
  position: absolute; inset: 0;
  display: grid; place-items: center; text-align: center;
  --med-sub-h: 12px; --med-sub-gap: 6px;
  transform: translateY(calc((var(--med-sub-h) + var(--med-sub-gap)) / 2));
}
.med-ring-clock {
  font-size: 34px; font-weight: 300; font-variant-numeric: tabular-nums;
  color: var(--heading); line-height: 1;
}
.med-ring-sub { font-size: var(--med-sub-h); color: var(--label); margin-top: var(--med-sub-gap); }
.cross-v { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(255,0,0,0.6); }
.cross-h { position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: rgba(255,0,0,0.6); }
.label { position: absolute; top: -24px; left: 50%; transform: translateX(-50%); color: white; font-size: 12px; }
</style>
</head>
<body>
<div class="med-ring-wrap">
  <div class="cross-v"></div><div class="cross-h"></div>
  <div class="label">+9px (new fix)</div>
  <svg class="med-ring" viewBox="0 0 200 200"><circle class="med-ring-bg" cx="100" cy="100" r="84"/><circle class="med-ring-fg" cx="100" cy="100" r="84"/></svg>
  <div class="med-ring-center">
    <div class="med-ring-clock">05:00</div>
    <div class="med-ring-sub">remaining</div>
  </div>
</div>
<div class="med-ring-wrap" style="--med-sub-h: 12px; --med-sub-gap: 6px;">
  <div class="cross-v"></div><div class="cross-h"></div>
  <div class="label">0 (no fix)</div>
  <svg class="med-ring" viewBox="0 0 200 200"><circle class="med-ring-bg" cx="100" cy="100" r="84"/><circle class="med-ring-fg" cx="100" cy="100" r="84"/></svg>
  <div class="med-ring-center" style="transform: none;">
    <div class="med-ring-clock">05:00</div>
    <div class="med-ring-sub">remaining</div>
  </div>
</div>
<div class="med-ring-wrap" style="--med-sub-h: 12px; --med-sub-gap: 6px;">
  <div class="cross-v"></div><div class="cross-h"></div>
  <div class="label">-9px (old sign)</div>
  <svg class="med-ring" viewBox="0 0 200 200"><circle class="med-ring-bg" cx="100" cy="100" r="84"/><circle class="med-ring-fg" cx="100" cy="100" r="84"/></svg>
  <div class="med-ring-center" style="transform: translateY(-9px);">
    <div class="med-ring-clock">05:00</div>
    <div class="med-ring-sub">remaining</div>
  </div>
</div>
</body>
</html>
