<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Full practices repro</title>
<style>
:root {
  --font: "sohne-var", "SF Pro Display", "Inter", system-ui, sans-serif;
  --bg: #0d253d; --surface: #11304e; --surface-2: #0c2440; --surface-3: #1c3a57;
  --heading: #f4f1ea; --body: #c8d0db; --label: #94a1b2;
  --border: #1c3a57; --border-soft: #2a4d72;
  --purple: #8b78ff; --purple-tint: rgba(139,120,255,0.1);
  --mint: #4cc88a;
  --r: 10px; --r-card: 16px;
  --shadow-amb: 0 18px 50px 0 rgba(0,0,0,0.4);
  --shadow-soft: 0 2px 8px 0 rgba(0,0,0,0.3);
  --shadow-glow: 0 0 40px -8px rgba(139,120,255,0.28);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); font-family: var(--font); color: var(--heading); }
.tnum { font-variant-numeric: tabular-nums; }
.wrap { max-width: 940px; margin: 0 auto; padding: 44px 36px 100px; }
.topbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 16px;
  padding: 18px 36px;
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter: blur(16px);
}
.topbar h2 { font-size: 22px; }
.topbar .sub { color: var(--body); font-size: 13px; margin-left: auto; }
.btn {
  appearance: none; border: 1px solid var(--border); background: var(--surface);
  color: var(--heading); font-family: var(--font); font-size: 14px; font-weight: 400;
  padding: 10px 18px; border-radius: var(--r); cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
}
.btn-primary {
  background: linear-gradient(135deg, #533afd, #8b78ff); border-color: transparent; color: #fff;
  box-shadow: var(--shadow-glow);
}
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-card); box-shadow: var(--shadow-amb); padding: 28px;
}
.seg {
  display: flex; gap: 6px; background: var(--surface-2);
  padding: 5px; border-radius: 14px; border: 1px solid var(--border);
  margin: 0 auto 10px; width: fit-content;
}
.seg button {
  appearance: none; border: 0; background: transparent; color: var(--body);
  font-family: var(--font); font-size: 13px; font-weight: 400;
  padding: 8px 18px; border-radius: 10px; cursor: pointer;
}
.seg button.on { background: var(--surface); color: var(--heading); box-shadow: var(--shadow-soft); }

/* practices */
.pr-card { max-width: 560px; margin: 0 auto; padding: 32px; }
.pr-panel { display: flex; flex-direction: column; align-items: center; }
.pr-intro { width: 100%; font-size: 15px; font-weight: 300; color: var(--body); line-height: 1.55; margin-bottom: 24px; }
.pr-field-label {
  width: 100%; text-align: left; font-size: 12px; font-weight: 500;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--label); margin-bottom: 10px;
}
.pr-chips-duration { display: inline-flex; gap: 10px; margin-bottom: 24px; }
.pr-chip {
  text-align: center; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--r); padding: 10px 18px; font-size: 14px; font-weight: 400;
  font-variant-numeric: tabular-nums; color: var(--heading);
  transition: border-color 150ms var(--ease), background 150ms var(--ease);
}
.pr-chip.is-active { color: var(--purple); font-weight: 500; }
.pr-chips-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; width: 100%; margin-bottom: 28px;
}
.pr-chips-grid .pr-chip {
  text-align: left; padding: 14px 16px;
}
.pr-chip-name { display: block; font-size: 14px; font-weight: 500; margin-bottom: 4px; }
.pr-chip.is-active { border-color: var(--purple); background: color-mix(in srgb, var(--purple) 8%, var(--surface-2)); }
.pr-chip.is-active .pr-chip-name { color: var(--purple); }
.pr-chip-desc { display: block; font-size: 12.5px; font-weight: 300; color: var(--body); line-height: 1.45; text-wrap: pretty; }
.pr-instruction {
  width: 100%; max-width: 460px; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: var(--r);
  padding: 18px 22px; font-size: 15px; font-weight: 300; line-height: 1.65;
  color: var(--body); margin-bottom: 28px;
}
.pr-controls { display: flex; justify-content: center; gap: 12px; }

.med-ring-wrap {
  position: relative; width: 180px; height: 180px;
  margin: 12px auto 32px; border-radius: 50%;
  background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--purple) 6%, var(--surface-2)) 0%, var(--surface-2) 70%);
  box-shadow: inset 0 0 0 1px var(--border-soft);
}
.med-ring { position: absolute; inset: 0; width: 100%; height: 100%; }
.med-ring-bg { fill: none; stroke: var(--border); stroke-width: 6; opacity: 0.9; }
.med-ring-fg {
  fill: none; stroke: var(--mint); stroke-width: 6; stroke-linecap: round;
  filter: drop-shadow(0 0 6px color-mix(in srgb, var(--mint) 40%, transparent));
}
.med-ring-center {
  position: absolute; inset: 0;
  display: grid; place-items: center; text-align: center;
  --med-sub-h: 12px; --med-sub-gap: 6px;
  transform: translateY(calc((var(--med-sub-h) + var(--med-sub-gap)) / 2));
}
.med-ring-clock {
  font-size: 34px; font-weight: 300; font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em; color: var(--heading); line-height: 1;
}
.med-ring-sub {
  font-size: var(--med-sub-h); font-weight: 400; color: var(--label);
  margin-top: var(--med-sub-gap); letter-spacing: 0.04em; text-transform: lowercase;
}
</style>
</head>
<body>
<div class="topbar"><h2>Practices</h2><span class="sub">Small tools to settle, between turns</span></div>
<div class="wrap">
  <div class="seg">
    <button type="button" class="">Breathing</button>
    <button type="button" class="on">Meditation</button>
  </div>
  <div class="card pr-card">
    <div class="pr-panel">
      <div class="pr-intro">A timed session with a soft bell at the start and end.</div>
      <div class="pr-field-label">Duration</div>
      <div class="pr-chips-duration">
        <button type="button" class="pr-chip">3 min</button>
        <button type="button" class="pr-chip is-active">5 min</button>
        <button type="button" class="pr-chip">10 min</button>
      </div>
      <div class="pr-field-label">Theme</div>
      <div class="pr-chips-grid">
        <button type="button" class="pr-chip is-active">
          <span class="pr-chip-name">Breath awareness</span>
          <span class="pr-chip-desc">Rest attention on the breath; return when it wanders.</span>
        </button>
        <button type="button" class="pr-chip">
          <span class="pr-chip-name">Body scan</span>
          <span class="pr-chip-desc">Move attention from head to feet; notice without changing.</span>
        </button>
        <button type="button" class="pr-chip">
          <span class="pr-chip-name">Loving-kindness</span>
          <span class="pr-chip-desc">Silently wish ease for yourself, then for someone else.</span>
        </button>
      </div>
      <div class="med-ring-wrap">
        <svg class="med-ring" viewBox="0 0 200 200">
          <circle class="med-ring-bg" cx="100" cy="100" r="84"/>
          <circle class="med-ring-fg" cx="100" cy="100" r="84" stroke-dasharray="527.79" stroke-dashoffset="0" transform="rotate(-90 100 100)"/>
        </svg>
        <div class="med-ring-center">
          <div class="med-ring-clock tnum">05:00</div>
          <div class="med-ring-sub">remaining</div>
        </div>
      </div>
      <div class="pr-instruction">Settle in. Let the breath come and go at its own pace. When the mind wanders, return to the feeling of the breath.</div>
      <div class="pr-controls">
        <button type="button" class="btn">Speak the intro</button>
        <button type="button" class="btn btn-primary">Begin</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
